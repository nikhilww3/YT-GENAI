<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ZeroFare mark: one split-flap "0" tile — bottle-green ground, chrome-yellow
       flap, ink glyph and seam. Colors hardcoded (not CSS vars) since this file
       is loaded standalone by the browser, outside the app's DOM. -->
  <rect width="32" height="32" fill="#0F3D2E" />
  <rect x="3" y="3" width="26" height="26" rx="3" fill="#F5C518" />
  <rect x="10" y="7" width="12" height="18" rx="6" fill="#12140F" />
  <rect x="13" y="10.5" width="6" height="11" rx="3" fill="#F5C518" />
  <rect x="3" y="15.3" width="26" height="1.4" fill="#12140F" opacity="0.45" />
</svg>
